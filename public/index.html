<!DOCTYPE html>
<html>
<head>
    <title>Attendance Management System</title>  
</head>

<body>
    <h1>Attendance Management System</h1>

    <h2>Login</h2>
    <input id="email" type ="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginButton">Login</button>
    <p id="message"></p>
    <h2>Mark Attendance</h2>
    <label for="userRole">Role</label>
    <select id ="userRole">
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>

    </select>
    <input id = "studentId" type="number" placeholder="Student ID">
    <select id = "attendanceStatus">
        <option value="Present">Present</option>
        <option value="Absent">Absent</option>
    </select>
    <button id="saveAttendanceButton">Save Attendance</button>
    <p id="attendanceMessage"></p>
    <script>
document.getElementById("loginButton").addEventListener("click", async () => {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const response = await fetch("/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email,
            password: password
        })
    });

    const data = await response.json();

    document.getElementById("message").textContent = data.message;
});
document.getElementById("saveAttendanceButton").addEventListener("click",async () => {
    const studentId = document.getElementById("studentId").value;
    const status = document.getElementById("attendanceStatus").value;
    const role = document.getElementById("userRole").value;

const response = await fetch("/attendance",{
    method : "POST",
    headers : {
             "Content-Type": "application/json"
    },
    body: JSON.stringify({
        role : role,
        student_id : studentId,
        status : status
    })
});
const data = await response.json();
document.getElementById("attendanceMessage").textContent = data.message;
});

</script>




</body>
</html>
